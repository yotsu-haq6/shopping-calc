<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>お買い物単価くらべ〜る</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="単価比較">
  <meta name="theme-color" content="#10b981">

  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E3%81%8A%E8%B2%B7%E3%81%84%E7%89%A9%E5%8D%98%E4%BE%A1%E3%81%8F%E3%82%89%E3%81%B9%E3%80%9C%E3%82%8B%22%2C%22short_name%22%3A%22%E5%8D%98%E4%BE%A1%E6%AF%94%E8%BC%83%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%2310b981%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%2520viewBox%3D%270%25200%2520100%2520100%27%253E%253Crect%2520width%3D%27100%27%2520height%3D%27100%27%2520rx%3D%2720%27%2520fill%3D%27%252310b981%27%2F%253E%253Ctext%2520x%3D%2750%27%2520y%3D%2765%27%2520font-size%3D%2755%27%2520text-anchor%3D%27middle%27%253E%25F0%259F%259B%2592%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      touch-action: manipulation;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12 select-none">
  <div class="max-w-md mx-auto p-4 sm:p-5">
    
    <header class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <span class="text-3xl">🛒</span>
        <div>
          <h1 class="text-lg font-black tracking-tight text-slate-900 leading-none">お買い物単価くらべ〜る</h1>
          <p class="text-xs text-slate-400 font-bold mt-1">どっちがお得？サクッと判定</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="swapBtn" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold text-slate-600 bg-white border border-slate-200 rounded-lg shadow-sm active:bg-slate-100 transition-all">
          <span>⇄</span> 入替
        </button>
        <button id="resetBtn" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold text-rose-600 bg-rose-50 border border-rose-100 rounded-lg active:bg-rose-100 transition-all">
          <span>🗑️</span> リセット
        </button>
      </div>
    </header>

    <div class="grid grid-cols-3 gap-1.5 bg-slate-200/80 p-1 rounded-2xl mb-4 font-bold text-xs">
      <button class="mode-tab py-2.5 rounded-xl transition-all flex flex-col items-center gap-0.5 bg-white text-emerald-600 shadow-sm" data-mode="weight">
        <span class="text-base">🥩</span>
        <span>重さ・容量</span>
        <span class="text-[10px] text-slate-400 font-normal">g / ml / kg / L</span>
      </button>
      <button class="mode-tab py-2.5 rounded-xl transition-all flex flex-col items-center gap-0.5 text-slate-500 hover:text-slate-800" data-mode="count">
        <span class="text-base">📦</span>
        <span>個数・パック</span>
        <span class="text-[10px] text-slate-400 font-normal">単品 vs セット</span>
      </button>
      <button class="mode-tab py-2.5 rounded-xl transition-all flex flex-col items-center gap-0.5 text-slate-500 hover:text-slate-800" data-mode="bonus">
        <span class="text-base">✨</span>
        <span>増量・割引</span>
        <span class="text-[10px] text-slate-400 font-normal">+〇%・見切りシール</span>
      </button>
    </div>

    <div id="resultBanner" class="bg-gradient-to-r from-slate-100 to-slate-200 border border-slate-200 rounded-2xl p-4 text-center mb-4 transition-all duration-300 shadow-sm">
      <p class="text-sm font-bold text-slate-500 mb-0.5">価格と数量を入力すると自動判定します</p>
    </div>

    <div class="space-y-3.5">
      
      <!-- 商品A -->
      <div id="cardA" class="bg-white rounded-2xl p-4 border-2 border-slate-200 shadow-sm transition-all duration-200">
        <div class="flex justify-between items-center mb-3">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-lg text-xs font-black bg-emerald-100 text-emerald-700">商品 A</span>
            <input type="text" id="nameA" placeholder="例: 通常パック / 単品" class="text-xs font-bold text-slate-600 bg-transparent placeholder-slate-300 focus:outline-none w-32 border-b border-dashed border-slate-300 pb-0.5">
          </div>
          <div class="text-right">
            <span class="text-[11px] text-slate-400 font-bold block" id="unitLabelA">100g単価</span>
            <span id="unitPriceA" class="text-base font-black text-slate-700">--</span>
          </div>
        </div>

        <div class="space-y-2.5">
          <div class="grid grid-cols-5 gap-2">
            <div class="col-span-3">
              <label class="text-[11px] font-bold text-slate-500 mb-1 block" id="qtyTitleA">内容量</label>
              <input type="number" id="qtyA" inputmode="decimal" placeholder="グラム等を入力" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-base font-black text-slate-800 focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200 transition-all">
            </div>
            <div class="col-span-2">
              <label class="text-[11px] font-bold text-slate-500 mb-1 block">単位</label>
              <select id="unitA" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-xs font-bold text-slate-700 focus:bg-white focus:border-emerald-500 focus:outline-none">
                <option value="g">g (グラム)</option>
                <option value="kg">kg (キロ)</option>
                <option value="ml">ml (ミリ)</option>
                <option value="L">L (リットル)</option>
              </select>
            </div>
          </div>

          <div class="flex gap-1.5 overflow-x-auto pb-1" id="quickChipsA"></div>

          <div class="grid grid-cols-5 gap-2">
            <div class="col-span-3">
              <label class="text-[11px] font-bold text-slate-500 mb-1 block">価格 (税込/税抜)</label>
              <div class="relative">
                <span class="absolute left-3 top-2 font-bold text-slate-400 text-sm">¥</span>
                <input type="number" id="priceA" inputmode="numeric" placeholder="価格を入力" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-7 pr-3 py-2 text-base font-black text-slate-800 focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200 transition-all">
              </div>
            </div>
            <div class="col-span-2">
              <label class="text-[11px] font-bold text-slate-500 mb-1 block">値引きシール</label>
              <select id="discountA" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-xs font-bold text-rose-600 focus:bg-white focus:border-rose-400 focus:outline-none">
                <option value="none">引なし</option>
                <option value="10p">1割引 (10%)</option>
                <option value="20p">2割引 (20%)</option>
                <option value="30p">3割引 (30%)</option>
                <option value="50p">半額 (50%)</option>
                <option value="20y">20円引き</option>
                <option value="50y">50円引き</option>
                <option value="100y">100円引き</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- 商品B -->
      <div id="cardB" class="bg-white rounded-2xl p-4 border-2 border-slate-200 shadow-sm transition-all duration-200">
        <div class="flex justify-between items-center mb-3">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-lg text-xs font-black bg-amber-100 text-amber-700">商品 B</span>
            <input type="text" id="nameB" placeholder="例: 増量品 / 大袋" class="text-xs font-bold text-slate-600 bg-transparent placeholder-slate-300 focus:outline-none w-32 border-b border-dashed border-slate-300 pb-0.5">
          </div>
          <div class="text-right">
            <span class="text-[11px] text-slate-400 font-bold block" id="unitLabelB">100g単価</span>
            <span id="unitPriceB" class="text-base font-black text-slate-700">--</span>
          </div>
        </div>

        <div class="space-y-2.5">
          <div class="grid grid-cols-5 gap-2">
            <div class="col-span-3">
              <label class="text-[11px] font-bold text-slate-500 mb-1 block" id="qtyTitleB">内容量</label>
              <input type="number" id="qtyB" inputmode="decimal" placeholder="グラム等を入力" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-base font-black text-slate-800 focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200 transition-all">
            </div>
            <div class="col-span-2">
              <label class="text-[11px] font-bold text-slate-500 mb-1 block">単位 / 増量</label>
              <select id="unitB" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-xs font-bold text-slate-700 focus:bg-white focus:border-emerald-500 focus:outline-none">
                <option value="g">g (グラム)</option>
                <option value="kg">kg (キロ)</option>
                <option value="ml">ml (ミリ)</option>
                <option value="L">L (リットル)</option>
              </select>
            </div>
          </div>

          <div class="flex gap-1.5 overflow-x-auto pb-1" id="quickChipsB"></div>

          <div class="grid grid-cols-5 gap-2">
            <div class="col-span-3">
              <label class="text-[11px] font-bold text-slate-500 mb-1 block">価格 (税込/税抜)</label>
              <div class="relative">
                <span class="absolute left-3 top-2 font-bold text-slate-400 text-sm">¥</span>
                <input type="number" id="priceB" inputmode="numeric" placeholder="価格を入力" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-7 pr-3 py-2 text-base font-black text-slate-800 focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200 transition-all">
              </div>
            </div>
            <div class="col-span-2">
              <label class="text-[11px] font-bold text-slate-500 mb-1 block">値引きシール</label>
              <select id="discountB" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-xs font-bold text-rose-600 focus:bg-white focus:border-rose-400 focus:outline-none">
                <option value="none">引なし</option>
                <option value="10p">1割引 (10%)</option>
                <option value="20p">2割引 (20%)</option>
                <option value="30p">3割引 (30%)</option>
                <option value="50p">半額 (50%)</option>
                <option value="20y">20円引き</option>
                <option value="50y">50円引き</option>
                <option value="100y">100円引き</option>
              </select>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let currentMode = 'weight';

    const chipsData = {
      weight: {
        A: [{lbl:'100g', v:100},{lbl:'150g', v:150},{lbl:'200g', v:200},{lbl:'300g', v:300},{lbl:'500g', v:500}],
        B: [{lbl:'130g', v:130},{lbl:'180g', v:180},{lbl:'250g', v:250},{lbl:'350g', v:350},{lbl:'1kg', v:1000}]
      },
      count: {
        A: [{lbl:'バラ1個', v:1},{lbl:'2個', v:2},{lbl:'3個組', v:3},{lbl:'5個入', v:5}],
        B: [{lbl:'3個入', v:3},{lbl:'5個組', v:5},{lbl:'6個入', v:6},{lbl:'10個組', v:10}]
      },
      bonus: {
        A: [{lbl:'通常容量', v:300},{lbl:'大容量', v:500}],
        B: [{lbl:'+10%増量', v:10, type:'bonus'},{lbl:'+20%増量', v:20, type:'bonus'},{lbl:'+30%増量', v:30, type:'bonus'}]
      }
    };

    function renderChips() {
      const cA = document.getElementById('quickChipsA');
      const cB = document.getElementById('quickChipsB');
      cA.innerHTML = '';
      cB.innerHTML = '';

      chipsData[currentMode].A.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'text-[11px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg px-2.5 py-1 shrink-0 active:scale-95 transition-all';
        btn.textContent = item.lbl;
        btn.onclick = () => { document.getElementById('qtyA').value = item.v; calculate(); };
        cA.appendChild(btn);
      });

      chipsData[currentMode].B.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'text-[11px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg px-2.5 py-1 shrink-0 active:scale-95 transition-all';
        btn.textContent = item.lbl;
        btn.onclick = () => {
          if (item.type === 'bonus') {
            const base = parseFloat(document.getElementById('qtyA').value) || 0;
            if (base > 0) {
              document.getElementById('qtyB').value = Math.round(base * (1 + item.v / 100));
            } else {
              document.getElementById('unitB').value = item.v + 'p';
            }
          } else {
            document.getElementById('qtyB').value = item.v;
          }
          calculate();
        };
        cB.appendChild(btn);
      });
    }

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.mode-tab').forEach(t => {
          t.className = 'mode-tab py-2.5 rounded-xl transition-all flex flex-col items-center gap-0.5 text-slate-500 hover:text-slate-800';
        });
        const target = e.currentTarget;
        target.className = 'mode-tab py-2.5 rounded-xl transition-all flex flex-col items-center gap-0.5 bg-white text-emerald-600 shadow-sm font-bold';
        currentMode = target.dataset.mode;
        updateModeUI();
      });
    });

    function updateModeUI() {
      const uA = document.getElementById('unitA');
      const uB = document.getElementById('unitB');
      const lblA = document.getElementById('qtyTitleA');
      const lblB = document.getElementById('qtyTitleB');

      if (currentMode === 'weight') {
        lblA.textContent = '内容量';
        lblB.textContent = '内容量';
        uA.innerHTML = '<option value="g">g (グラム)</option><option value="kg">kg (キロ)</option><option value="ml">ml (ミリ)</option><option value="L">L (リットル)</option>';
        uB.innerHTML = '<option value="g">g (グラム)</option><option value="kg">kg (キロ)</option><option value="ml">ml (ミリ)</option><option value="L">L (リットル)</option>';
      } else if (currentMode === 'count') {
        lblA.textContent = '入数・個数';
        lblB.textContent = '入数・個数';
        uA.innerHTML = '<option value="count">個 / 本 / コ</option><option value="pack">パック</option>';
        uB.innerHTML = '<option value="count">個 / 本 / コ</option><option value="pack">パック</option>';
      } else if (currentMode === 'bonus') {
        lblA.textContent = '通常の内容量';
        lblB.textContent = '増量後の総量';
        uA.innerHTML = '<option value="g">g / ml</option><option value="count">個入</option>';
        uB.innerHTML = '<option value="direct">指定量 (g/ml)</option><option value="10p">+10% 増量</option><option value="15p">+15% 増量</option><option value="20p">+20% 増量</option><option value="30p">+30% 増量</option>';
      }

      renderChips();
      calculate();
    }

    function applyDiscount(price, type) {
      if (!price || isNaN(price)) return 0;
      switch(type) {
        case '10p': return price * 0.9;
        case '20p': return price * 0.8;
        case '30p': return price * 0.7;
        case '50p': return price * 0.5;
        case '20y': return Math.max(0, price - 20);
        case '50y': return Math.max(0, price - 50);
        case '100y': return Math.max(0, price - 100);
        default: return price;
      }
    }

    function calculate() {
      let qA = parseFloat(document.getElementById('qtyA').value) || 0;
      let pA = parseFloat(document.getElementById('priceA').value) || 0;
      let qB = parseFloat(document.getElementById('qtyB').value) || 0;
      let pB = parseFloat(document.getElementById('priceB').value) || 0;

      const unitA = document.getElementById('unitA').value;
      const unitB = document.getElementById('unitB').value;

      pA = applyDiscount(pA, document.getElementById('discountA').value);
      pB = applyDiscount(pB, document.getElementById('discountB').value);

      if (currentMode === 'bonus') {
        if (unitB.endsWith('p')) {
          const percent = parseFloat(unitB.replace('p', ''));
          qB = qA * (1 + percent / 100);
          document.getElementById('qtyB').value = qB ? Math.round(qB * 10) / 10 : '';
        }
      }

      let standardA = qA;
      let standardB = qB;
      let unitName = '100g';

      if (currentMode === 'weight') {
        if (unitA === 'kg' || unitA === 'L') standardA *= 1000;
        if (unitB === 'kg' || unitB === 'L') standardB *= 1000;
        unitName = (unitA === 'ml' || unitA === 'L' || unitB === 'ml' || unitB === 'L') ? '100ml' : '100g';
      } else if (currentMode === 'count') {
        unitName = '1個';
      } else if (currentMode === 'bonus') {
        unitName = '1単位';
      }

      document.getElementById('unitLabelA').textContent = `${unitName}単価`;
      document.getElementById('unitLabelB').textContent = `${unitName}単価`;

      let unitCostA = (standardA > 0 && pA > 0) ? (pA / standardA) * (currentMode === 'count' ? 1 : (currentMode === 'weight' ? 100 : 1)) : 0;
      let unitCostB = (standardB > 0 && pB > 0) ? (pB / standardB) * (currentMode === 'count' ? 1 : (currentMode === 'weight' ? 100 : 1)) : 0;

      document.getElementById('unitPriceA').textContent = unitCostA ? `¥${unitCostA.toFixed(1)}` : '--';
      document.getElementById('unitPriceB').textContent = unitCostB ? `¥${unitCostB.toFixed(1)}` : '--';

      const cardA = document.getElementById('cardA');
      const cardB = document.getElementById('cardB');
      const banner = document.getElementById('resultBanner');

      cardA.classList.remove('ring-4', 'ring-emerald-400', 'bg-emerald-50/40', 'border-emerald-500');
      cardB.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50/40', 'border-amber-500');

      if (unitCostA > 0 && unitCostB > 0) {
        const diff = Math.abs(unitCostA - unitCostB);
        const diffPercent = (diff / Math.max(unitCostA, unitCostB) * 100).toFixed(1);

        if (Math.abs(unitCostA - unitCostB) < 0.001) {
          banner.className = 'bg-slate-800 text-white rounded-2xl p-4 text-center mb-4 shadow-lg';
          banner.innerHTML = `
            <div class="text-xs font-bold text-slate-300">引き分け</div>
            <div class="text-xl font-black mt-0.5">どちらも全く同じ単価です！</div>
          `;
        } else if (unitCostA < unitCostB) {
          cardA.classList.add('ring-4', 'ring-emerald-400', 'bg-emerald-50/40', 'border-emerald-500');
          banner.className = 'bg-emerald-500 text-white rounded-2xl p-4 text-center mb-4 shadow-lg shadow-emerald-500/20';
          banner.innerHTML = `
            <div class="flex items-center justify-center gap-1.5 text-xs font-bold bg-white/20 py-0.5 px-3 rounded-full w-max mx-auto mb-1">
              <span>👑</span> 商品 A の方がおトク！
            </div>
            <div class="text-2xl font-black tracking-tight">約 ${diffPercent}% 安い</div>
            <div class="text-xs font-bold mt-1 text-emerald-100">${unitName}あたり 約 ¥${diff.toFixed(1)} お得</div>
          `;
        } else {
          cardB.classList.add('ring-4', 'ring-amber-400', 'bg-amber-50/40', 'border-amber-500');
          banner.className = 'bg-amber-500 text-white rounded-2xl p-4 text-center mb-4 shadow-lg shadow-amber-500/20';
          banner.innerHTML = `
            <div class="flex items-center justify-center gap-1.5 text-xs font-bold bg-white/20 py-0.5 px-3 rounded-full w-max mx-auto mb-1">
              <span>👑</span> 商品 B の方がおトク！
            </div>
            <div class="text-2xl font-black tracking-tight">約 ${diffPercent}% 安い</div>
            <div class="text-xs font-bold mt-1 text-amber-100">${unitName}あたり 約 ¥${diff.toFixed(1)} お得</div>
          `;
        }
      } else {
        banner.className = 'bg-gradient-to-r from-slate-100 to-slate-200 border border-slate-200 rounded-2xl p-4 text-center mb-4 shadow-sm';
        banner.innerHTML = '<p class="text-sm font-bold text-slate-500 mb-0.5">価格と数量を入力すると自動判定します</p>';
      }
    }

    ['qtyA', 'priceA', 'discountA', 'unitA', 'qtyB', 'priceB', 'discountB', 'unitB'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', calculate);
      el.addEventListener('change', calculate);
    });

    document.getElementById('swapBtn').addEventListener('click', () => {
      ['name', 'qty', 'price', 'discount', 'unit'].forEach(field => {
        const a = document.getElementById(field + 'A');
        const b = document.getElementById(field + 'B');
        const temp = a.value;
        a.value = b.value;
        b.value = temp;
      });
      calculate();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      ['qtyA', 'priceA', 'qtyB', 'priceB', 'nameA', 'nameB'].forEach(id => {
        document.getElementById(id).value = '';
      });
      ['discountA', 'discountB'].forEach(id => {
        document.getElementById(id).value = 'none';
      });
      calculate();
    });

    renderChips();
    calculate();
  </script>
</body>
</html>
